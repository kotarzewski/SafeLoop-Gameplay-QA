name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: python -c "from mcp.server.mcpserver import MCPServer; from safeloop_gameplay_qa.server import build_server; print('MCP v2 import OK')"
      - run: pytest -q
