[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safeloop-gameplay-qa"
version = "0.1.0"
description = "Least-privilege gameplay and physics QA MCP agent for Codex, with Godot as the first runtime adapter."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jan Kotarzewski"}]
dependencies = ["mcp>=2,<3"]

[project.scripts]
safeloop-gameplay-qa = "safeloop_gameplay_qa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safeloop_gameplay_qa = ["runtime/*.gd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
